<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" role="img" aria-labelledby="title desc">
  <title id="title">Kelle Digital Lab</title>
  <desc id="desc">Identidade oficial do Polo Kelle Digital Lab</desc>
  <defs>
    <linearGradient id="k" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset=".48" stop-color="#48E7FF"/>
      <stop offset=".52" stop-color="#FFB020"/>
      <stop offset="1" stop-color="#FF6B00"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".72" stop-color="#EAF8FF"/>
      <stop offset="1" stop-color="#86E9FF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(18 18)">
    <circle cx="72" cy="72" r="57" fill="#07111F" stroke="#163B56" stroke-width="2"/>
    <path d="M42 28v88M45 72l49-44M45 72l54 48" fill="none" stroke="url(#k)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M15 68c28-19 82-28 125-8M12 87c37 16 91 15 126-5" fill="none" stroke="url(#k)" stroke-width="2.5" opacity=".9"/>
    <circle cx="18" cy="68" r="4" fill="#00D4FF"/><circle cx="137" cy="82" r="4" fill="#FF7A00"/>
  </g>
  <g transform="translate(175 43)">
    <text x="0" y="58" fill="url(#word)" font-family="Inter, Arial, sans-serif" font-size="65" font-weight="850" letter-spacing="5">KELLE</text>
    <text x="4" y="104" fill="#FF8A12" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" letter-spacing="9">DIGITAL LAB</text>
  </g>
</svg>
