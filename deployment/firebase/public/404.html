<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Não Encontrada — XPeX Academy</title>
  <meta name="theme-color" content="#0B1220">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230B1220'/><path d='M30 25 L70 75 M70 25 L30 75' stroke='%23FF7A00' stroke-width='14' stroke-linecap='round'/><circle cx='50' cy='50' r='12' fill='%2300D4FF'/></svg>">
  <style>
    body {
      background: #0B1220;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
    }
    .box {
      max-width: 480px;
    }
    .code {
      font-size: 5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #FF7A00, #00D4FF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    p {
      color: #94A3B8;
      margin-bottom: 28px;
    }
    a {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 9999px;
      background: #FF7A00;
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Página não encontrada</h1>
    <p>O conteúdo que você procurava não existe ou foi movido para outro local.</p>
    <a href="/">Voltar ao Início</a>
  </div>
</body>
</html>
