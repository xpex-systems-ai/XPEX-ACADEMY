          from fastapi.testclient import TestClient

          import app
          from src.core.events.database import get_db_session

          class FakeScalarResult:
              def scalar(self):
                  return 1

          class FakeDbSession:
              async def execute(self, statement):
                  return FakeScalarResult()

          async def fake_db_session():
              yield FakeDbSession()

          app.app.dependency_overrides[get_db_session] = fake_db_session
          try:
              client = TestClient(app.app)
              health = client.get('/api/v1/health')
              assert health.status_code == 200, health.text
              assert health.json() is True, health.text

              allowed = client.options('/api/v1/health', headers={
                  'Origin': 'https://staging.example.test',
                  'Access-Control-Request-Method': 'GET',
              })
              assert allowed.status_code in {200, 204}, allowed.text
              assert allowed.headers.get('access-control-allow-origin') in {
                  'https://staging.example.test',
                  '*',
              }

              denied = client.options('/api/v1/health', headers={
                  'Origin': 'https://not-allowed.example.test',
                  'Access-Control-Request-Method': 'GET',
              })
              assert denied.headers.get('access-control-allow-origin') != 'https://not-allowed.example.test'
              print('health and cors ok')
          finally:
              app.app.dependency_overrides.clear()
          PY


