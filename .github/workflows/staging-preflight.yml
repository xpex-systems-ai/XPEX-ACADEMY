name: Staging preflight

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  simulated-preflight:
    runs-on: ubuntu-latest
    env:
      LEARNHOUSE_AUTH_JWT_SECRET_KEY: staging-import-check-secret-minimum-32
      TESTING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.10.7
          enable-cache: true
          working-directory: apps/api

      - name: Prepare fictitious env files
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          cat > .env.staging <<'ENV'
          GCP_PROJECT_ID=xpex-stage-12345
          GCP_REGION=us-central1
          ARTIFACT_REPOSITORY=xpex-academy-staging
          CLOUD_RUN_SERVICE=xpex-academy-staging
          IMAGE_NAME=xpex-academy-api
          CLOUD_RUN_SA=xpex-academy-staging-runner@xpex-stage-12345.iam.gserviceaccount.com
          CLOUD_SQL_INSTANCE=xpex-stage-12345:us-central1:xpex-academy-staging-db
          DB_NAME=xpex_academy_staging
          DB_USER=xpex_staging_app
          REDIS_INSTANCE=xpex-academy-staging-redis
          VPC_CONNECTOR=xpex-academy-staging-connector
          STAGING_BUCKET=xpex-academy-staging-media
          STAGING_API_HOST=staging-api.example.test
          STAGING_API_URL=https://staging-api.example.test
          STAGING_FRONTEND_ORIGIN=https://staging.example.test
          IMAGE_TAG=ci-preflight
          MAX_INSTANCES=3
          SECRET_JWT_NAME=learnhouse-auth-jwt-staging
          SECRET_SQL_NAME=learnhouse-sql-staging
          SECRET_REDIS_NAME=learnhouse-redis-staging
          LEARNHOUSE_ENV=staging
          LEARNHOUSE_DEVELOPMENT_MODE=false
          LEARNHOUSE_SITE_NAME="XpeX Academy Staging"
          LEARNHOUSE_SITE_DESCRIPTION="Fictitious staging CI environment."
          LEARNHOUSE_CONTACT_EMAIL=staging-ops@example.test
          LEARNHOUSE_DOMAIN=staging-api.example.test
          LEARNHOUSE_FRONTEND_DOMAIN=staging.example.test
          LEARNHOUSE_SSL=true
          LEARNHOUSE_PORT=8080
          LEARNHOUSE_TENANCY=single
          LEARNHOUSE_ALLOWED_ORIGINS=https://staging.example.test
          LEARNHOUSE_ALLOWED_REGEXP=^https://staging\.example\.test$
          LEARNHOUSE_CONTENT_DELIVERY_TYPE=s3api
          LEARNHOUSE_S3_API_BUCKET_NAME=xpex-academy-staging-media
          LEARNHOUSE_S3_API_ENDPOINT_URL=https://storage.googleapis.com
          LEARNHOUSE_AUTH_JWT_SECRET_KEY=fictitious-secret-only-for-ci-minimum-32
          LEARNHOUSE_SQL_CONNECTION_STRING=postgresql+asyncpg://staging_user:fake_password@127.0.0.1:5432/xpex_academy_staging
          LEARNHOUSE_REDIS_CONNECTION_STRING=redis://127.0.0.1:6379/0
          LEARNHOUSE_IS_AI_ENABLED=false
          ENV
          cp .env.staging /tmp/env-public
          sed -e 's/^GCP_PROJECT_ID=/PROJECT_ID=/' \
              -e 's/^GCP_REGION=/REGION=/' \
              -e 's/^CLOUD_RUN_SERVICE=/SERVICE_NAME=/' \
              -e 's/^CLOUD_RUN_SA=/CLOUD_RUN_SERVICE_ACCOUNT=/' \
              -e 's/^STAGING_BUCKET=/GCS_BUCKET=/' \
              /tmp/env-public > /tmp/env-legacy
          cat > /tmp/run-expect-fail <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          label="$1"
          shift
          set +e
          output="$($@ 2>&1)"
          rc=$?
          set -e
          if [[ "$rc" -eq 0 ]]; then
            printf 'Expected failure for %s, got exit 0\n%s\n' "$label" "$output" >&2
            exit 1
          fi
          if [[ "$output" != *NO-GO* ]]; then
            printf 'Expected NO-GO for %s, got output:\n%s\n' "$label" "$output" >&2
            exit 1
          fi
          if [[ "$output" == *'gcloud builds submit'* || "$output" == *'gcloud run deploy'* ]]; then
            printf 'Unexpected build/deploy command in %s output:\n%s\n' "$label" "$output" >&2
            exit 1
          fi
          printf 'Expected failure confirmed for %s with exit %s\n' "$label" "$rc"
          SH
          chmod +x /tmp/run-expect-fail
          cat > /tmp/run-expect-pending <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          label="$1"
          shift
          set +e
          output="$($@ 2>&1)"
          rc=$?
          set -e
          if [[ "$rc" -ne 0 ]]; then
            printf 'Expected pending success for %s, got exit %s\n%s\n' "$label" "$rc" "$output" >&2
            exit 1
          fi
          if [[ "$output" != *'Resultado final: PENDÊNCIA EXTERNA'* ]]; then
            printf 'Expected PENDÊNCIA EXTERNA for %s, got output:\n%s\n' "$label" "$output" >&2
            exit 1
          fi
          printf 'Expected pending confirmed for %s\n' "$label"
          SH
          chmod +x /tmp/run-expect-pending

      - name: Validate YAML workflows
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |path| YAML.load_file(path); puts "ok #{path}" }'

      - name: Validate shell scripts
        run: |
          set -euo pipefail
          bash -n scripts/*.sh apps/api/*.sh

      - name: Validate public aliases
        run: |
          set -euo pipefail
          echo 'Validating public alias contract: GCP_PROJECT_ID/GCP_REGION/CLOUD_RUN_SERVICE/CLOUD_RUN_SA/STAGING_BUCKET'
          test -f .env.staging.example
          grep -En "^(GCP_PROJECT_ID|GCP_REGION|CLOUD_RUN_SERVICE|CLOUD_RUN_SA|STAGING_BUCKET)=" .env.staging.example
          scripts/check-env.sh /tmp/env-public

      - name: Validate legacy aliases
        run: |
          set -euo pipefail
          echo 'Validating legacy alias compatibility: PROJECT_ID/REGION/SERVICE_NAME/CLOUD_RUN_SERVICE_ACCOUNT/GCS_BUCKET'
          scripts/check-env.sh /tmp/env-legacy

      - name: Run simulated preflight
        run: |
          set -euo pipefail
          echo 'Running simulated preflight with public aliases'
          /tmp/run-expect-pending public-preflight scripts/preflight-staging.sh --env-file /tmp/env-public --simulated
          echo 'Running simulated preflight with legacy aliases'
          /tmp/run-expect-pending legacy-preflight scripts/preflight-staging.sh --env-file /tmp/env-legacy --simulated

      - name: Render staging dry-run
        run: |
          set -euo pipefail
          echo 'Rendering dry-run with public aliases'
          scripts/deploy-staging.sh --dry-run --env-file /tmp/env-public | tee /tmp/dry-public.out
          grep -En 'DRY_RUN=true: no build, deploy, verify, rollback, or resource creation was executed\.' /tmp/dry-public.out
          echo 'Rendering dry-run with legacy aliases'
          scripts/deploy-staging.sh --dry-run --env-file /tmp/env-legacy | tee /tmp/dry-legacy.out
          grep -En 'DRY_RUN=true: no build, deploy, verify, rollback, or resource creation was executed\.' /tmp/dry-legacy.out

      - name: Test production protection
        run: |
          set -euo pipefail
          cp /tmp/env-public /tmp/env-prod
          sed -i 's/xpex-stage-12345/xpex-prod-12345/g' /tmp/env-prod
          /tmp/run-expect-fail production-target scripts/preflight-staging.sh --env-file /tmp/env-prod --simulated

      - name: Test placeholder protection
        run: |
          set -euo pipefail
          cp /tmp/env-public /tmp/env-placeholder
          printf '\nDUMMY=REPLACE_WITH_SECRET_MANAGER_VALUE\n' >> /tmp/env-placeholder
          /tmp/run-expect-fail placeholder scripts/preflight-staging.sh --env-file /tmp/env-placeholder --simulated

      - name: Test tracked-env protection
        run: |
          set -euo pipefail
          cleanup() { git rm --cached .env.staging >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          git add -f .env.staging
          /tmp/run-expect-fail tracked-env scripts/preflight-staging.sh --env-file .env.staging --simulated
          cleanup
          trap - EXIT

      - name: Test gcloud billing and API protections
        run: |
          set -euo pipefail
          make_stub_dir() {
            local mode="$1"
            local dir
            dir="$(mktemp -d)"
            printf '#!/usr/bin/env bash\nexit 0\n' > "$dir/docker"
            chmod +x "$dir/docker"
            cat > "$dir/gcloud" <<'SH'
          #!/usr/bin/env bash
          mode="${PREFLIGHT_GCLOUD_STUB_MODE:?}"
          case "$*" in
            "auth list"*)
              [[ "$mode" == "auth-empty" ]] && exit 0
              echo "ci@example.test"
              ;;
            "billing projects describe"*)
              [[ "$mode" == "billing-false" ]] && { echo "false"; exit 0; }
              [[ "$mode" == "empty" ]] && exit 0
              echo "true"
              ;;
            "services list"*)
              [[ "$mode" == "empty" ]] && exit 0
              if [[ "$mode" == "api-missing" ]]; then
                printf '%s\n' run.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com secretmanager.googleapis.com sqladmin.googleapis.com storage.googleapis.com redis.googleapis.com
              else
                printf '%s\n' run.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com secretmanager.googleapis.com sqladmin.googleapis.com storage.googleapis.com redis.googleapis.com vpcaccess.googleapis.com
              fi
              ;;
            *) echo resource ;;
          esac
          SH
            chmod +x "$dir/gcloud"
            printf '%s' "$dir"
          }
          stub="$(make_stub_dir billing-false)"
          PREFLIGHT_GCLOUD_STUB_MODE=billing-false PATH="$stub:$PATH" /tmp/run-expect-fail billing-false scripts/preflight-staging.sh --env-file /tmp/env-public
          stub="$(make_stub_dir api-missing)"
          PREFLIGHT_GCLOUD_STUB_MODE=api-missing PATH="$stub:$PATH" /tmp/run-expect-fail api-missing scripts/preflight-staging.sh --env-file /tmp/env-public
          stub="$(make_stub_dir empty)"
          PREFLIGHT_GCLOUD_STUB_MODE=empty PATH="$stub:$PATH" /tmp/run-expect-fail empty-gcloud-response scripts/preflight-staging.sh --env-file /tmp/env-public
          stub="$(make_stub_dir auth-empty)"
          PREFLIGHT_GCLOUD_STUB_MODE=auth-empty PATH="$stub:$PATH" /tmp/run-expect-pending auth-empty scripts/preflight-staging.sh --env-file /tmp/env-public


      - name: Test first staging deploy plan renderer
        run: |
          set -euo pipefail
          make_renderer_stub_dir() {
            local mode="$1"
            local dir log
            dir="$(mktemp -d)"
            log="$dir/gcloud.log"
            cat > "$dir/docker" <<'SH'
          #!/usr/bin/env bash
          exit 0
          SH
            cat > "$dir/gcloud" <<'SH'
          #!/usr/bin/env bash
          mode="${RENDER_GCLOUD_STUB_MODE:-valid}"
          log="${RENDER_GCLOUD_CALL_LOG:?}"
          printf '%s\n' "$*" >> "$log"
          case "$*" in
            *builds\ submit*|*run\ deploy*|*set-iam-policy*|*add-iam-policy-binding*|*services\ enable*|*secrets\ versions\ add*|*run\ services\ update-traffic*|*sql\ databases\ create*|*redis\ instances\ create*) echo "mutable command must not be executed" >&2; exit 99 ;;
            "auth list"*) echo "ci@example.test" ;;
            "config get-value project"*) echo "xpex-stage-12345" ;;
            "projects describe"*) echo "xpex-stage-12345" ;;
            "billing projects describe"*) [[ "$mode" == "billing-unavailable" ]] && exit 1; echo "true" ;;
            "services list"*)
              [[ "$mode" == "api-unqueryable" ]] && exit 1
              printf '%s\n' run.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com secretmanager.googleapis.com sqladmin.googleapis.com storage.googleapis.com redis.googleapis.com vpcaccess.googleapis.com
              ;;
            artifacts\ repositories\ describe*) echo "projects/xpex-stage-12345/locations/us-central1/repositories/xpex-academy-staging" ;;
            run\ services\ describe*maxScale*) echo "3" ;;
            run\ services\ describe*) [[ "$mode" == "previous-absent" ]] && exit 1 || echo "xpex-academy-staging" ;;
            iam\ service-accounts\ describe*) echo "xpex-academy-staging-runner@xpex-stage-12345.iam.gserviceaccount.com" ;;
            sql\ instances\ describe*) echo "xpex-academy-staging-db" ;;
            sql\ databases\ list*) echo "xpex_academy_staging" ;;
            sql\ users\ list*) echo "xpex_staging_app" ;;
            redis\ instances\ describe*) echo "xpex-academy-staging-redis" ;;
            compute\ networks\ vpc-access\ connectors\ describe*) echo "xpex-academy-staging-connector" ;;
            storage\ buckets\ describe*) echo "xpex-academy-staging-media" ;;
            compute\ regions\ describe*) echo "CPUS 24 0" ;;
            secrets\ describe*) [[ "$mode" == "secret-missing" && "$*" == *"learnhouse-sql-staging"* ]] && exit 1; echo "projects/123/secrets/staging" ;;
            projects\ get-iam-policy*)
              [[ "$mode" == "iam-insufficient" ]] && printf '{"bindings":[]}' || printf '{"bindings":[{"role":"roles/cloudsql.client","members":["serviceAccount:xpex-academy-staging-runner@xpex-stage-12345.iam.gserviceaccount.com"]},{"role":"roles/secretmanager.secretAccessor","members":["serviceAccount:xpex-academy-staging-runner@xpex-stage-12345.iam.gserviceaccount.com"]},{"role":"roles/storage.objectAdmin","members":["serviceAccount:xpex-academy-staging-runner@xpex-stage-12345.iam.gserviceaccount.com"]}]}'
              ;;
            *) echo resource ;;
          esac
          SH
            chmod +x "$dir/gcloud" "$dir/docker"
            printf '%s' "$dir"
          }
          run_renderer() {
            local label="$1" mode="$2" expect="$3" envfile="${4:-/tmp/env-public}"
            local stub log output rc
            stub="$(make_renderer_stub_dir "$mode")"
            log="$stub/gcloud.log"
            set +e
            output="$(PREVIOUS_REVISION=xpex-academy-staging-00001-old RENDER_GCLOUD_STUB_MODE="$mode" RENDER_GCLOUD_CALL_LOG="$log" PATH="$stub:$PATH" scripts/render-first-staging-deploy-plan.sh --env-file "$envfile" 2>&1)"
            rc=$?
            set -e
            printf '%s\n' "$output" > "/tmp/renderer-$label.out"
            if [[ "$rc" -ne "$expect" ]]; then
              printf 'Unexpected rc for %s: got %s expected %s\n%s\n' "$label" "$rc" "$expect" "$output" >&2
              exit 1
            fi
            if grep -E 'fake_password|fictitious-secret-only-for-ci|staging-import-check-secret' "/tmp/renderer-$label.out"; then
              echo "secret leaked in renderer output for $label" >&2; exit 1
            fi
            if [[ -s "$log" ]] && grep -E 'builds submit|run deploy|set-iam-policy|add-iam-policy-binding|services enable|secrets versions add|update-traffic|databases create|instances create' "$log"; then
              echo "mutable gcloud command executed by renderer for $label" >&2; cat "$log" >&2; exit 1
            fi
            if [[ "$expect" -ne 20 ]]; then
              grep -F '⚠️ COMANDO MUTÁVEL — EXECUÇÃO HUMANA APÓS APROVAÇÃO' "/tmp/renderer-$label.out"
            fi
          }
          run_renderer valid valid 0
          run_renderer secret-missing secret-missing 20
          run_renderer iam-insufficient iam-insufficient 20
          run_renderer billing-unavailable billing-unavailable 10
          run_renderer api-unqueryable api-unqueryable 10
          set +e
          env -i PATH=/usr/bin:/bin PREVIOUS_REVISION=xpex-academy-staging-00001-old scripts/render-first-staging-deploy-plan.sh --env-file /tmp/env-public >/tmp/renderer-no-gcloud.out 2>&1
          rc=$?
          set -e
          test "$rc" -eq 10
          grep -F 'gcloud CLI absent' /tmp/renderer-no-gcloud.out
          cp /tmp/env-public /tmp/env-renderer-prod; sed -i 's/xpex-stage-12345/xpex-prod-12345/g' /tmp/env-renderer-prod; run_renderer production valid 20 /tmp/env-renderer-prod
          cp /tmp/env-public /tmp/env-renderer-placeholder; echo 'EXTRA=CHANGE_ME' >> /tmp/env-renderer-placeholder; run_renderer placeholder valid 20 /tmp/env-renderer-placeholder
          cp /tmp/env-public /tmp/env-renderer-max; sed -i 's/MAX_INSTANCES=3/MAX_INSTANCES=99/' /tmp/env-renderer-max; run_renderer max-instances valid 20 /tmp/env-renderer-max
          cp /tmp/env-public /tmp/env-renderer-missing-secret; sed -i '/SECRET_REDIS_NAME=/d' /tmp/env-renderer-missing-secret; run_renderer missing-secret-var valid 20 /tmp/env-renderer-missing-secret
          set +e
          output="$(RENDER_GCLOUD_STUB_MODE=valid RENDER_GCLOUD_CALL_LOG=/tmp/renderer-prev.log PATH="$(make_renderer_stub_dir valid):$PATH" scripts/render-first-staging-deploy-plan.sh --env-file /tmp/env-public 2>&1)"
          rc=$?
          set -e
          test "$rc" -eq 10
          grep -F 'PREVIOUS_REVISION absent' <<<"$output"
          cleanup() { git rm --cached .env.staging >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          git add -f .env.staging
          run_renderer tracked-env valid 20 .env.staging
          cleanup
          trap - EXIT

      - name: Test read-only staging resource audit
        run: |
          set -euo pipefail
          make_audit_stub_dir() {
            local mode="$1"
            local dir
            dir="$(mktemp -d)"
            cat > "$dir/gcloud" <<'SH'
          #!/usr/bin/env bash
          mode="${AUDIT_GCLOUD_STUB_MODE:?}"
          args="$*"
          printf '%s\n' "$args" >> "${AUDIT_GCLOUD_CALL_LOG:?}"
          if [[ "$args" =~ (services enable|run deploy|builds submit|secrets versions access|secrets create|projects add-iam-policy-binding|artifacts repositories create|sql instances create|redis instances create|storage buckets create) ]]; then
            echo "mutable command refused in stub: $args" >&2
            exit 99
          fi
          case "$args" in
            auth\ list*) echo "auditor@example.test" ;;
            "config get-value project") [[ "$mode" == "project-invalid" ]] && echo "wrong-stage-12345" || echo "xpex-stage-12345" ;;
            projects\ describe*) [[ "$mode" == "project-invalid" ]] && exit 1 || echo "xpex-stage-12345" ;;
            billing\ projects\ describe*) [[ "$mode" == "billing-disabled" ]] && echo "false" || echo "true" ;;
            services\ list*)
              [[ "$mode" == "services-list-denied" ]] && { echo "permission denied" >&2; exit 1; }
              printf '%s\n' run.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com secretmanager.googleapis.com sqladmin.googleapis.com storage.googleapis.com redis.googleapis.com vpcaccess.googleapis.com
              ;;
            artifacts\ repositories\ describe*) [[ "$mode" == "resource-missing" ]] && exit 1 || echo "projects/xpex-stage-12345/locations/us-central1/repositories/xpex-academy-staging" ;;
            run\ services\ describe*)
              if [[ "$args" == *"metadata.name"* ]]; then
                echo "xpex-academy-staging"
              elif [[ "$args" == *"autoscaling.knative.dev/maxScale"* ]]; then
                [[ "$mode" == "maxscale-invalid" ]] && { echo "not-a-number"; exit 0; }
                [[ "$mode" == "maxscale-too-high" ]] && { echo "99"; exit 0; }
                echo "3"
              else
                echo "unexpected cloud run describe format" >&2
                exit 1
              fi
              ;;
            iam\ service-accounts\ describe*) echo "xpex-academy-staging-runner@xpex-stage-12345.iam.gserviceaccount.com" ;;
            sql\ instances\ describe*) echo "xpex-academy-staging-db" ;;
            sql\ databases\ list*) echo "xpex_academy_staging" ;;
            sql\ users\ list*) echo "xpex_staging_app" ;;
            redis\ instances\ describe*) echo "xpex-academy-staging-redis" ;;
            compute\ networks\ vpc-access\ connectors\ describe*) echo "xpex-academy-staging-connector" ;;
            storage\ buckets\ describe*) echo "xpex-academy-staging-media" ;;
            compute\ regions\ describe*) echo "CPUS 24 2" ;;
            secrets\ describe*)
              [[ "$mode" == "secret-jwt-missing" && "$args" == *"learnhouse-auth-jwt-staging"* ]] && exit 1
              [[ "$mode" == "secret-sql-missing" && "$args" == *"learnhouse-sql-staging"* ]] && exit 1
              [[ "$mode" == "secret-redis-missing" && "$args" == *"learnhouse-redis-staging"* ]] && exit 1
              case "$args" in
                *learnhouse-auth-jwt-staging*) echo "projects/123/secrets/learnhouse-auth-jwt-staging" ;;
                *learnhouse-sql-staging*) echo "projects/123/secrets/learnhouse-sql-staging" ;;
                *learnhouse-redis-staging*) echo "projects/123/secrets/learnhouse-redis-staging" ;;
                *) exit 1 ;;
              esac
              ;;
            projects\ get-iam-policy*)
              if [[ "$mode" == "iam-wrong-member" || "$mode" == "iam-insufficient" ]]; then
                printf '{"bindings":[{"role":"roles/cloudsql.client","members":["serviceAccount:other@example.test"]},{"role":"roles/secretmanager.secretAccessor","members":["serviceAccount:other@example.test"]},{"role":"roles/storage.objectAdmin","members":["serviceAccount:other@example.test"]}]}'
              else
                printf '{"bindings":[{"role":"roles/cloudsql.client","members":["serviceAccount:xpex-academy-staging-runner@xpex-stage-12345.iam.gserviceaccount.com"]},{"role":"roles/secretmanager.secretAccessor","members":["serviceAccount:xpex-academy-staging-runner@xpex-stage-12345.iam.gserviceaccount.com"]},{"role":"roles/storage.objectAdmin","members":["serviceAccount:xpex-academy-staging-runner@xpex-stage-12345.iam.gserviceaccount.com"]}]}'
              fi
              ;;
            *) echo "stubbed" ;;
          esac
          SH
            chmod +x "$dir/gcloud"
            printf '%s' "$dir"
          }
          run_audit_expect() {
            local label="$1" mode="$2" expected_rc="$3"
            local stub output rc log
            stub="$(make_audit_stub_dir "$mode")"
            log="$(mktemp)"
            set +e
            output="$(AUDIT_GCLOUD_STUB_MODE="$mode" AUDIT_GCLOUD_CALL_LOG="$log" PATH="$stub:$PATH" scripts/audit-staging-resources.sh --env-file /tmp/env-public 2>&1)"
            rc=$?
            set -e
            printf '%s\n' "$output" > "/tmp/audit-$label.out"
            cp "$log" "/tmp/audit-$label.calls"
            if [[ "$rc" -ne "$expected_rc" ]]; then
              printf 'Unexpected rc for %s: got %s expected %s\n%s\n' "$label" "$rc" "$expected_rc" "$output" >&2
              exit 1
            fi
            if [[ "$output" == *fake_password* || "$output" == *postgresql+asyncpg://* || "$output" == *'secrets versions access'* ]]; then
              printf 'Sensitive or forbidden output for %s:\n%s\n' "$label" "$output" >&2
              exit 1
            fi
          }
          run_audit_expect resource-present ok 0
          grep -F 'Resultado final: GO' /tmp/audit-resource-present.out
          grep -F 'GO | cloud-run-max-instances | maxScale=3' /tmp/audit-resource-present.out
          grep -F 'GO | iam:roles/cloudsql.client | role bound to runtime principal' /tmp/audit-resource-present.out
          run_audit_expect resource-missing resource-missing 20
          grep -F 'artifact-registry' /tmp/audit-resource-missing.out
          run_audit_expect billing-disabled billing-disabled 20
          grep -F 'NO-GO | billing | disabled' /tmp/audit-billing-disabled.out
          run_audit_expect project-invalid project-invalid 20
          grep -F 'NO-GO | project' /tmp/audit-project-invalid.out
          run_audit_expect maxscale-invalid maxscale-invalid 20
          grep -F 'maxScale=not-a-number' /tmp/audit-maxscale-invalid.out
          run_audit_expect maxscale-too-high maxscale-too-high 20
          grep -F 'maxScale=99 exceeds staging guardrail' /tmp/audit-maxscale-too-high.out
          run_audit_expect secret-jwt-missing secret-jwt-missing 20
          grep -F 'secret:SECRET_JWT_NAME' /tmp/audit-secret-jwt-missing.out
          run_audit_expect secret-sql-missing secret-sql-missing 20
          grep -F 'secret:SECRET_SQL_NAME' /tmp/audit-secret-sql-missing.out
          run_audit_expect secret-redis-missing secret-redis-missing 20
          grep -F 'secret:SECRET_REDIS_NAME' /tmp/audit-secret-redis-missing.out
          run_audit_expect iam-wrong-member iam-wrong-member 20
          grep -F 'role is not bound to runtime principal' /tmp/audit-iam-wrong-member.out
          run_audit_expect services-list-denied services-list-denied 10
