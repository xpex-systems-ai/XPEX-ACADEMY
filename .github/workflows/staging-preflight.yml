          raise 'deploy wrapper missing' unless workflow_raw.include?('DRY_RUN=false IMAGE_TAG="$IMAGE_TAG" scripts/deploy-staging.sh --env-file "$ENV_FILE"')
          raise 'verify wrapper missing' unless workflow_raw.include?('scripts/verify-staging-deployment.sh "$STAGING_API_URL_VALUE" "$STAGING_FRONTEND_ORIGIN_VALUE"')
          raise 'rollback preparation missing' unless workflow_raw.include?('scripts/prepare-staging-rollback.sh --env-file "$ENV_FILE" --previous-revision "$PREVIOUS_REVISION"')
          raise 'plan checkout full_sha missing' unless workflow_raw.include?('git checkout --detach "$FULL_SHA"')
          raise 'renderer HEAD guard missing' unless workflow_raw.include?('renderer would run on non-approved HEAD')
          raise 'config fingerprint missing' unless workflow_raw.include?('plan_config_sha256') && workflow_raw.include?('sha256sum') && workflow_raw.include?('protected staging config fingerprint differs from plan')
          raise 'previous revision active check missing' unless workflow_raw.include?('latestReadyRevisionName') && workflow_raw.include?('active revision diverged from previous_revision')
