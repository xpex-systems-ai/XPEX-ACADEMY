      - name: Test simulated health and CORS verifier
        run: |
          set -euo pipefail
          port_file="$(mktemp)"
          python3 - "$port_file" <<'PY' &
          import json
          import sys
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          port_file = sys.argv[1]

          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == '/api/v1/health':
                      body = json.dumps(True).encode()
                      self.send_response(200)
                      self.send_header('content-type', 'application/json')
                      self.end_headers()
                      self.wfile.write(body)
                  else:
                      self.send_response(404)
                      self.end_headers()

              def do_HEAD(self):
                  if self.path == '/__xpex_missing_route__':
                      self.send_response(404)
                  else:
                      self.send_response(200)
                  self.end_headers()

              def do_OPTIONS(self):
                  self.send_response(204)
                  if self.headers.get('Origin') == 'https://staging.example.test':
                      self.send_header('access-control-allow-origin', 'https://staging.example.test')
                  self.send_header('access-control-allow-methods', 'GET')
                  self.end_headers()

              def log_message(self, *args):
                  pass

          server = ThreadingHTTPServer(('127.0.0.1', 0), H)
          with open(port_file, 'w', encoding='utf-8') as fh:
              fh.write(str(server.server_port))
          server.serve_forever()
          PY
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; rm -f "$port_file"' EXIT
          for _ in $(seq 1 50); do
            [[ -s "$port_file" ]] && break
            sleep 0.1
          done
          test -s "$port_file"
          base_url="http://127.0.0.1:$(cat "$port_file")"
          scripts/verify-staging-deployment.sh "$base_url" https://staging.example.test
          scripts/verify-staging.sh "$base_url" https://staging.example.test

      - name: Secret scan
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          patterns = re.compile(
              r"AKIA[0-9A-Z]{16}|-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|AIza[0-9A-Za-z_-]{35}"
          )
          files = subprocess.check_output(['git', 'ls-files', '-z'])
          offenders = []
          for raw in files.split(b'\0'):
              if not raw:
                  continue
              path = Path(raw.decode())
              if any(part in {'.git', '.venv', 'node_modules'} for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if patterns.search(text):
                  offenders.append(str(path))
          if offenders:
              print('Potential secret patterns found:', file=sys.stderr)
              for path in offenders:
                  print(f'- {path}', file=sys.stderr)
              raise SystemExit(1)
          print('Secret scan passed')
          PY
