name: Academy Migration Safety Preflight

on:
  pull_request:
    paths:
      - 'apps/api/migrations/**'
      - 'scripts/academy_migration_preflight.py'
      - '.github/workflows/academy-migration-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check without accessing database
        run: python -m py_compile scripts/academy_migration_preflight.py apps/api/migrations/env.py
      - name: Ensure missing DB credentials fail closed
        env:
          LEARNHOUSE_SQL_CONNECTION_STRING: ''
        run: |
          set +e
          python scripts/academy_migration_preflight.py > preflight.out 2>&1
          status=$?
          set -e
          cat preflight.out
          test "$status" -eq 2
          grep -q 'BLOCKED:' preflight.out
      - name: Ensure local database URL is refused
        env:
          LEARNHOUSE_SQL_CONNECTION_STRING: 'postgresql://user:placeholder@localhost:5432/learnhouse'
        run: |
          set +e
          python scripts/academy_migration_preflight.py > preflight.out 2>&1
          status=$?
          set -e
          cat preflight.out
          test "$status" -eq 2
          grep -q 'BLOCKED:' preflight.out
