name: Migration Dry-Run

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "apps/api/migrations/**"
      - "apps/api/src/db/**"
      - ".github/workflows/migration-dry-run.yaml"
  push:
    branches:
      - dev
    paths:
      - "apps/api/migrations/**"
      - "apps/api/src/db/**"
      - ".github/workflows/migration-dry-run.yaml"

jobs:
  migration-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: latest

      - name: Install API dependencies
        run: uv sync
        working-directory: apps/api

      - name: Compile full Alembic upgrade chain offline
        run: |
          uv run alembic upgrade head --sql > /tmp/xpex-migration.sql
          test -s /tmp/xpex-migration.sql
          grep -q "xpex_editorial_draft" /tmp/xpex-migration.sql
        working-directory: apps/api
        env:
          LEARNHOUSE_SQL_CONNECTION_STRING: postgresql://learnhouse:learnhouse@localhost:5432/learnhouse
          LEARNHOUSE_AUTH_JWT_SECRET_KEY: migration-dry-run-only
          LEARNHOUSE_TENANCY: "false"

      - name: Validate single Alembic head
        run: |
          heads="$(uv run alembic heads | grep -c '(head)')"
          test "$heads" -eq 1
        working-directory: apps/api
        env:
          LEARNHOUSE_SQL_CONNECTION_STRING: postgresql://learnhouse:learnhouse@localhost:5432/learnhouse
          LEARNHOUSE_AUTH_JWT_SECRET_KEY: migration-dry-run-only
          LEARNHOUSE_TENANCY: "false"
