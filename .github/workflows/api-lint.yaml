name: API Lint
on:
  push:
    branches:
      - dev
    paths:
      - "apps/api/**"
  pull_request:
    paths:
      - "apps/api/**"
permissions:
  contents: read
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: latest
      - name: Ruff lint changed Python files
        # The repository-wide Ruff backlog is tracked separately. This gate
        # compares against the PR base (or previous pushed commit) so every new
        # or modified Python file remains strict without hiding historical debt.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- \
            'apps/api/*.py' 'apps/api/**/*.py')
          if (( ${#files[@]} == 0 )); then
            echo "No changed Python files to lint."
            exit 0
          fi
          uvx ruff==0.16.2 check --config apps/api/pyproject.toml "${files[@]}"
