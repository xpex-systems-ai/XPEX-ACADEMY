name: Firebase Fabric lockfile sync

on:
  push:
    branches:
      - feat/firebase-fabric-foundation-v1
    paths:
      - .github/lockfile-sync.trigger

permissions:
  contents: write

jobs:
  sync-bun-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/firebase-fabric-foundation-v1
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Regenerate Bun lockfile
        working-directory: apps/web
        run: bun install

      - name: Verify frozen install
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          git config user.name "xpex-gxeon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/package.json apps/web/bun.lock
          if git diff --cached --quiet; then
            echo "No lockfile changes required."
            exit 0
          fi
          git commit -m "chore(firebase): sync bun lockfile"
          git push origin HEAD:feat/firebase-fabric-foundation-v1
