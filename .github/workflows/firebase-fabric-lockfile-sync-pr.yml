name: Firebase Fabric lockfile sync PR

on:
  pull_request:
    branches:
      - dev
    paths:
      - .github/lockfile-pr.trigger

permissions:
  contents: write

jobs:
  sync-bun-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Regenerate and verify lockfile
        working-directory: apps/web
        run: |
          bun install
          bun install --frozen-lockfile

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          git config user.name "xpex-gxeon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/package.json apps/web/bun.lock
          if git diff --cached --quiet; then
            echo "No lockfile changes required."
            exit 0
          fi
          git commit -m "chore(firebase): sync bun lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
