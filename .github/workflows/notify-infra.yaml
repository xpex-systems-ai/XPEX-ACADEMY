name: Notify Infrastructure

on:
  push:
    branches:
      - main
      - dev
    tags:
      - '[0-9]*'
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions: {}

jobs:
  notify:
    name: Dispatch to Infrastructure Repo
    runs-on: ubuntu-latest
    # Skip for pull requests opened from forks: GitHub does not expose
    # secrets (INFRA_REPO_PAT) to fork PRs, so the dispatch can only ever
    # fail there. Still runs for pushes and same-repo (internal) PRs.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      INFRA_REPO_PAT: ${{ secrets.INFRA_REPO_PAT }}
      INFRA_REPO: ${{ vars.INFRA_REPO }}
    steps:
      - name: Validate infrastructure dispatch configuration
        id: config
        run: |
          if [ -z "${INFRA_REPO_PAT}" ]; then
            echo "Infrastructure dispatch skipped: required secret INFRA_REPO_PAT is not configured."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${INFRA_REPO}" ]; then
            echo "Infrastructure dispatch skipped: required repository variable INFRA_REPO is not configured."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Send repository dispatch
        if: steps.config.outputs.ready == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.INFRA_REPO_PAT }}
          repository: ${{ vars.INFRA_REPO }}
          event-type: source-update
          client-payload: |
            {
              "sha": "${{ github.sha }}",
              "branch": "${{ github.ref_name }}",
              "event": "${{ github.event_name }}",
              "pr_number": "${{ github.event.pull_request.number || '' }}",
              "pr_action": "${{ github.event.action || '' }}",
              "repo": "${{ github.repository }}"
            }
