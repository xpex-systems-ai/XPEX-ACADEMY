name: Staging build

on:
  push:
    branches: [dev, codex-003-staging]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: us-central1
  ARTIFACT_REPOSITORY: xpex-academy-staging
  IMAGE_NAME: xpex-academy-api
  GCP_STAGING_BUILD_ENABLED: ${{ vars.GCP_STAGING_BUILD_ENABLED }}

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.10.7
          enable-cache: true
          working-directory: apps/api
      - name: Sync dependencies from lockfile
        run: uv sync --frozen
      - name: Validate Python imports
        run: |
          LEARNHOUSE_AUTH_JWT_SECRET_KEY=staging-import-check-secret-minimum-32 TESTING=true uv run python -c "import app, numpy; print('imports ok')"
      - name: Container runtime tests
        run: bash tests/test_container_runtime.sh

  staging-mode:
    name: Report GCP staging mode
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Report whether the optional GCP build is enabled
        run: |
          set -euo pipefail
          case "${GCP_STAGING_BUILD_ENABLED:-}" in
            true)
              echo "GCP staging image build enabled by GCP_STAGING_BUILD_ENABLED=true."
              ;;
            ""|false)
              echo "::notice::GCP staging image build is disabled. Set the repository variable GCP_STAGING_BUILD_ENABLED=true only after the staging Workload Identity configuration is ready."
              ;;
            *)
              echo "::error::GCP_STAGING_BUILD_ENABLED must be either true or false."
              exit 1
              ;;
          esac

  build:
    name: Build optional GCP staging image
    needs: [validate, staging-mode]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && vars.GCP_STAGING_BUILD_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_STAGING }}
          service_account: ${{ secrets.GCP_CLOUD_BUILD_SERVICE_ACCOUNT_STAGING }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Submit build-only Cloud Build
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"
          if [[ -z "$IMAGE_TAG" ]]; then
            echo "IMAGE_TAG cannot be empty" >&2
            exit 1
          fi
          gcloud builds submit \
            --project "${{ secrets.GCP_PROJECT_ID_STAGING }}" \
            --config cloudbuild.yaml \
            --substitutions _REGION="$REGION",_ARTIFACT_REPOSITORY="$ARTIFACT_REPOSITORY",_IMAGE_NAME="$IMAGE_NAME",_IMAGE_TAG="$IMAGE_TAG"
