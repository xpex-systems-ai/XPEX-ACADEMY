name: staging
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print deploy commands without executing them
        required: true
        default: 'true'
permissions:
  contents: read
jobs:
  validate-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate env template
        run: scripts/check-env.sh .env.staging.example
      - name: Validate shell scripts
        run: bash -n scripts/check-env.sh scripts/deploy-staging.sh scripts/verify-staging.sh
      - name: Render staging dry run
        run: scripts/deploy-staging.sh --dry-run --env-file .env.staging.example
