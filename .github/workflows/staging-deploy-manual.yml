          set -euo pipefail
          DRY_RUN=false IMAGE_TAG="$IMAGE_TAG" scripts/deploy-staging.sh --env-file "$ENV_FILE"
          echo "deploy_result=concluído" >> "$GITHUB_OUTPUT"
      - name: capture-new-revision
        id: new_revision
        env:
