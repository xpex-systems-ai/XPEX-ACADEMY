      - name: validate-active-revision
        id: active_revision
        env:
          FULL_SHA: ${{ needs.plan.outputs.full_sha }}
          MODE_INPUT: ${{ inputs.mode }}
          CONFIRMATION_INPUT: ${{ inputs.confirmation }}
          PREVIOUS_REVISION_INPUT: ${{ inputs.previous_revision }}
          CHANGE_TICKET_INPUT: ${{ inputs.change_ticket }}
          PREVIOUS_REVISION: ${{ steps.validate_runtime_context.outputs.previous_revision }}
          CLOUD_RUN_SERVICE_VALUE: ${{ vars.CLOUD_RUN_SERVICE }}
          GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION_VALUE: ${{ vars.GCP_REGION }}
        run: |
          set -euo pipefail
          COMMIT_SHA_INPUT="$FULL_SHA" scripts/validate-staging-deploy-inputs.sh
          active_revision="$(gcloud run services describe "$CLOUD_RUN_SERVICE_VALUE" --project "$GCP_PROJECT_ID_VALUE" --region "$GCP_REGION_VALUE" --format='value(status.latestReadyRevisionName)')"
          [[ -n "$active_revision" ]] || { echo "NO-GO: active revision absent" >&2; exit 20; }
          [[ "$active_revision" == "$PREVIOUS_REVISION" ]] || { echo "NO-GO: active revision diverged from previous_revision" >&2; exit 20; }
          echo "previous_revision=$active_revision" >> "$GITHUB_OUTPUT"
      - name: build
        id: build
        env:
          IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
        run: |
          set -euo pipefail
          scripts/build-staging.sh --env-file "$ENV_FILE" --image-tag "$IMAGE_TAG" --execute
          echo "build_result=concluído" >> "$GITHUB_OUTPUT"
      - name: resolve-image-digest
        id: image
        env:
          IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
          GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION_VALUE: ${{ vars.GCP_REGION }}
          ARTIFACT_REPOSITORY_VALUE: ${{ vars.ARTIFACT_REPOSITORY }}
        run: |
          set -euo pipefail
          image_uri="$GCP_REGION_VALUE-docker.pkg.dev/$GCP_PROJECT_ID_VALUE/$ARTIFACT_REPOSITORY_VALUE/xpex-academy-api:$IMAGE_TAG"
          image_digest="$(gcloud artifacts docker images describe "$image_uri" --format='value(image_summary.digest)')"
          [[ -n "$image_digest" ]] || { echo "NO-GO: image digest absent" >&2; exit 20; }
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"; echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"
      - name: deploy
        id: deploy_step
        env:
          IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
