name: Manual staging deploy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA that exists on dev
        required: true
        type: string
      mode:
        description: Render plan only or execute after approval
        required: true
        default: plan
        type: choice
        options: [plan, execute]
      confirmation:
        description: Required for execute; exact value DEPLOY_XPEX_STAGING
        required: false
        type: string
      previous_revision:
        description: Required concrete Cloud Run revision for execute rollback preparation
        required: false
        type: string
      change_ticket:
        description: Required human approval/evidence identifier for execute
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: xpex-academy-staging-deploy
  cancel-in-progress: false

env:
  EXPECTED_CONFIRMATION: DEPLOY_XPEX_STAGING

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.decision.outputs.decision }}
      image_tag: ${{ steps.context.outputs.image_tag }}
      full_sha: ${{ steps.context.outputs.full_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev
      - name: Validate dispatch inputs and derive immutable context
        id: context
        env:
          COMMIT_SHA_INPUT: ${{ inputs.commit_sha }}
          MODE_INPUT: ${{ inputs.mode }}
          CONFIRMATION_INPUT: ${{ inputs.confirmation }}
          PREVIOUS_REVISION_INPUT: ${{ inputs.previous_revision }}
          CHANGE_TICKET_INPUT: ${{ inputs.change_ticket }}
        run: |
          set -euo pipefail
          validation_output="$(scripts/validate-staging-deploy-inputs.sh --require-dev-ancestry)"
          full_sha="$(printf '%s\n' "$validation_output" | awk -F= '$1 == "FULL_SHA" { print $2 }')"
          image_tag="$(printf '%s\n' "$validation_output" | awk -F= '$1 == "IMAGE_TAG" { print $2 }')"
          [[ -n "$full_sha" && -n "$image_tag" ]] || { echo "NO-GO: validator did not return immutable context" >&2; exit 20; }
          echo "full_sha=$full_sha" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
      - name: Prepare temporary staging env
        env:
          GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION_VALUE: ${{ vars.GCP_REGION }}
          ARTIFACT_REPOSITORY_VALUE: ${{ vars.ARTIFACT_REPOSITORY }}
          CLOUD_RUN_SERVICE_VALUE: ${{ vars.CLOUD_RUN_SERVICE }}
          CLOUD_RUN_SA_VALUE: ${{ vars.CLOUD_RUN_SA }}
          CLOUD_SQL_INSTANCE_VALUE: ${{ vars.CLOUD_SQL_INSTANCE }}
          DB_NAME_VALUE: ${{ vars.DB_NAME }}
          DB_USER_VALUE: ${{ vars.DB_USER }}
          REDIS_INSTANCE_VALUE: ${{ vars.REDIS_INSTANCE }}
          VPC_CONNECTOR_VALUE: ${{ vars.VPC_CONNECTOR }}
          STAGING_BUCKET_VALUE: ${{ vars.STAGING_BUCKET }}
          STAGING_API_URL_VALUE: ${{ vars.STAGING_API_URL }}
          STAGING_FRONTEND_ORIGIN_VALUE: ${{ vars.STAGING_FRONTEND_ORIGIN }}
          MAX_INSTANCES_VALUE: ${{ vars.MAX_INSTANCES }}
          SECRET_JWT_NAME_VALUE: ${{ vars.SECRET_JWT_NAME }}
          SECRET_SQL_NAME_VALUE: ${{ vars.SECRET_SQL_NAME }}
          SECRET_REDIS_NAME_VALUE: ${{ vars.SECRET_REDIS_NAME }}
          IMAGE_TAG_VALUE: ${{ steps.context.outputs.image_tag }}
        run: |
          set -euo pipefail
          ENV_FILE="$RUNNER_TEMP/staging.env"
          cleanup() { rm -f "$ENV_FILE"; }
          trap cleanup EXIT
          reject_unsafe_value() {
            local label="$1" value="$2"
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "NO-GO: $label contains CR/LF" >&2; exit 20
            fi
            if printf '%s' "$value" | LC_ALL=C grep -q '[[:cntrl:]]'; then
              echo "NO-GO: $label contains unsupported control characters" >&2; exit 20
            fi
          }
          append_env() {
            local name="$1" value="$2"
            reject_unsafe_value "$name" "$value"
            printf '%s=%s\n' "$name" "$value" >> "$ENV_FILE"
          }
          : > "$ENV_FILE"
          chmod 600 "$ENV_FILE"
          api_host="$STAGING_API_URL_VALUE"; api_host="${api_host#http://}"; api_host="${api_host#https://}"; api_host="${api_host%%/*}"
          frontend_host="$STAGING_FRONTEND_ORIGIN_VALUE"; frontend_host="${frontend_host#http://}"; frontend_host="${frontend_host#https://}"; frontend_host="${frontend_host%%/*}"
          append_env GCP_PROJECT_ID "$GCP_PROJECT_ID_VALUE"
          append_env GCP_REGION "$GCP_REGION_VALUE"
          append_env ARTIFACT_REPOSITORY "$ARTIFACT_REPOSITORY_VALUE"
          append_env CLOUD_RUN_SERVICE "$CLOUD_RUN_SERVICE_VALUE"
          append_env SERVICE_NAME "$CLOUD_RUN_SERVICE_VALUE"
          append_env IMAGE_NAME xpex-academy-api
          append_env CLOUD_RUN_SA "$CLOUD_RUN_SA_VALUE"
          append_env CLOUD_RUN_SERVICE_ACCOUNT "$CLOUD_RUN_SA_VALUE"
          append_env CLOUD_SQL_INSTANCE "$CLOUD_SQL_INSTANCE_VALUE"
          append_env DB_NAME "$DB_NAME_VALUE"
          append_env DB_USER "$DB_USER_VALUE"
          append_env REDIS_INSTANCE "$REDIS_INSTANCE_VALUE"
          append_env VPC_CONNECTOR "$VPC_CONNECTOR_VALUE"
          append_env STAGING_BUCKET "$STAGING_BUCKET_VALUE"
          append_env STAGING_API_HOST "$api_host"
          append_env STAGING_API_URL "$STAGING_API_URL_VALUE"
          append_env STAGING_FRONTEND_ORIGIN "$STAGING_FRONTEND_ORIGIN_VALUE"
          append_env IMAGE_TAG "$IMAGE_TAG_VALUE"
          append_env MAX_INSTANCES "$MAX_INSTANCES_VALUE"
          append_env SECRET_JWT_NAME "$SECRET_JWT_NAME_VALUE"
          append_env SECRET_SQL_NAME "$SECRET_SQL_NAME_VALUE"
          append_env SECRET_REDIS_NAME "$SECRET_REDIS_NAME_VALUE"
          append_env LEARNHOUSE_ENV staging
          append_env LEARNHOUSE_DEVELOPMENT_MODE false
          append_env LEARNHOUSE_SITE_NAME 'XpeX Academy Staging'
          append_env LEARNHOUSE_SITE_DESCRIPTION 'XpeX Academy staging API'
          append_env LEARNHOUSE_CONTACT_EMAIL staging-ops@example.invalid
          append_env LEARNHOUSE_DOMAIN "$api_host"
          append_env LEARNHOUSE_FRONTEND_DOMAIN "$frontend_host"
          append_env LEARNHOUSE_SSL true
          append_env LEARNHOUSE_PORT 8080
          append_env LEARNHOUSE_TENANCY single
          append_env LEARNHOUSE_ALLOWED_ORIGINS "$STAGING_FRONTEND_ORIGIN_VALUE"
          append_env LEARNHOUSE_CONTENT_DELIVERY_TYPE s3api
          append_env LEARNHOUSE_S3_API_BUCKET_NAME "$STAGING_BUCKET_VALUE"
          append_env LEARNHOUSE_S3_API_ENDPOINT_URL https://storage.googleapis.com
          append_env LEARNHOUSE_AUTH_JWT_SECRET_KEY "secret-manager-name:$SECRET_JWT_NAME_VALUE"
          append_env LEARNHOUSE_SQL_CONNECTION_STRING "secret-manager-name:$SECRET_SQL_NAME_VALUE"
          append_env LEARNHOUSE_REDIS_CONNECTION_STRING "secret-manager-name:$SECRET_REDIS_NAME_VALUE"
          append_env LEARNHOUSE_IS_AI_ENABLED false
          echo "ENV_FILE=$ENV_FILE" >> "$GITHUB_ENV"
          trap - EXIT
      - name: Render plan and run read-only checks
        id: decision
        env:
          PREVIOUS_REVISION: ${{ inputs.previous_revision }}
          MODE_INPUT: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/staging-plan"
          set +e
          scripts/render-first-staging-deploy-plan.sh --env-file "$ENV_FILE" > "$RUNNER_TEMP/staging-plan/plan.md" 2>&1
          rc=$?
          set -e
          scripts/audit-staging-resources.sh --env-file "$ENV_FILE" > "$RUNNER_TEMP/staging-plan/audit.md" 2>&1 || true
          scripts/preflight-staging.sh --env-file "$ENV_FILE" > "$RUNNER_TEMP/staging-plan/preflight.md" 2>&1 || true
          decision="GO"; [[ "$rc" -eq 10 ]] && decision="PENDÊNCIA EXTERNA"; [[ "$rc" -ne 0 && "$rc" -ne 10 ]] && decision="NO-GO"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          execution="não solicitada"
          if [[ "$MODE_INPUT" == "execute" ]]; then
            if [[ "$decision" == "GO" ]]; then execution="aprovada"; else execution="bloqueada"; fi
          fi
          {
            echo "PLANO: $decision"
            echo "EXECUÇÃO: $execution"
            echo "BUILD: não executado"
            echo "DEPLOY: não executado"
            echo "VERIFY: não executado"
            echo "ROLLBACK: não necessário"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: staging-deploy-plan-redacted
          path: ${{ runner.temp }}/staging-plan
          retention-days: 14
      - name: Remove temporary staging env
        if: always()
        run: rm -f "$ENV_FILE"

  deploy:
    name: deploy
    needs: plan
    if: ${{ inputs.mode == 'execute' && needs.plan.outputs.decision == 'GO' }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.full_sha }}
      - name: Verify immutable deployment context before auth
        env:
          FULL_SHA: ${{ needs.plan.outputs.full_sha }}
          IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
          MODE_INPUT: ${{ inputs.mode }}
          CONFIRMATION_INPUT: ${{ inputs.confirmation }}
          PREVIOUS_REVISION_INPUT: ${{ inputs.previous_revision }}
          CHANGE_TICKET_INPUT: ${{ inputs.change_ticket }}
        run: |
          set -euo pipefail
          COMMIT_SHA_INPUT="$FULL_SHA" scripts/validate-staging-deploy-inputs.sh
          [[ "$(git rev-parse HEAD)" == "$FULL_SHA" ]] || { echo "NO-GO: checkout HEAD differs from approved full_sha" >&2; exit 20; }
          git fetch --no-tags origin dev:refs/remotes/origin/dev
          git merge-base --is-ancestor "$FULL_SHA" refs/remotes/origin/dev
          [[ "$IMAGE_TAG" == "stg-${FULL_SHA:0:12}" ]] || { echo "NO-GO: image_tag differs from approved full_sha" >&2; exit 20; }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Validate execute inputs and prepare env
        env:
          GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION_VALUE: ${{ vars.GCP_REGION }}
          ARTIFACT_REPOSITORY_VALUE: ${{ vars.ARTIFACT_REPOSITORY }}
          CLOUD_RUN_SERVICE_VALUE: ${{ vars.CLOUD_RUN_SERVICE }}
          CLOUD_RUN_SA_VALUE: ${{ vars.CLOUD_RUN_SA }}
          CLOUD_SQL_INSTANCE_VALUE: ${{ vars.CLOUD_SQL_INSTANCE }}
          DB_NAME_VALUE: ${{ vars.DB_NAME }}
          DB_USER_VALUE: ${{ vars.DB_USER }}
          REDIS_INSTANCE_VALUE: ${{ vars.REDIS_INSTANCE }}
          VPC_CONNECTOR_VALUE: ${{ vars.VPC_CONNECTOR }}
          STAGING_BUCKET_VALUE: ${{ vars.STAGING_BUCKET }}
          STAGING_API_URL_VALUE: ${{ vars.STAGING_API_URL }}
          STAGING_FRONTEND_ORIGIN_VALUE: ${{ vars.STAGING_FRONTEND_ORIGIN }}
          MAX_INSTANCES_VALUE: ${{ vars.MAX_INSTANCES }}
          SECRET_JWT_NAME_VALUE: ${{ vars.SECRET_JWT_NAME }}
          SECRET_SQL_NAME_VALUE: ${{ vars.SECRET_SQL_NAME }}
          SECRET_REDIS_NAME_VALUE: ${{ vars.SECRET_REDIS_NAME }}
        run: |
          set -euo pipefail
          ENV_FILE="$RUNNER_TEMP/staging.env"
          cleanup() { rm -f "$ENV_FILE"; }
          trap cleanup EXIT
          reject_unsafe_value() {
            local label="$1" value="$2"
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "NO-GO: $label contains CR/LF" >&2; exit 20
            fi
            if printf '%s' "$value" | LC_ALL=C grep -q '[[:cntrl:]]'; then
              echo "NO-GO: $label contains unsupported control characters" >&2; exit 20
            fi
          }
          append_env() {
            local name="$1" value="$2"
            reject_unsafe_value "$name" "$value"
            printf '%s=%s\n' "$name" "$value" >> "$ENV_FILE"
          }
          : > "$ENV_FILE"
          chmod 600 "$ENV_FILE"
          api_host="$STAGING_API_URL_VALUE"; api_host="${api_host#http://}"; api_host="${api_host#https://}"; api_host="${api_host%%/*}"
          frontend_host="$STAGING_FRONTEND_ORIGIN_VALUE"; frontend_host="${frontend_host#http://}"; frontend_host="${frontend_host#https://}"; frontend_host="${frontend_host%%/*}"
          append_env GCP_PROJECT_ID "$GCP_PROJECT_ID_VALUE"
          append_env GCP_REGION "$GCP_REGION_VALUE"
          append_env ARTIFACT_REPOSITORY "$ARTIFACT_REPOSITORY_VALUE"
          append_env CLOUD_RUN_SERVICE "$CLOUD_RUN_SERVICE_VALUE"
          append_env IMAGE_NAME xpex-academy-api
          append_env CLOUD_RUN_SA "$CLOUD_RUN_SA_VALUE"
          append_env CLOUD_SQL_INSTANCE "$CLOUD_SQL_INSTANCE_VALUE"
          append_env DB_NAME "$DB_NAME_VALUE"
          append_env DB_USER "$DB_USER_VALUE"
          append_env REDIS_INSTANCE "$REDIS_INSTANCE_VALUE"
          append_env VPC_CONNECTOR "$VPC_CONNECTOR_VALUE"
          append_env STAGING_BUCKET "$STAGING_BUCKET_VALUE"
          append_env STAGING_API_HOST "$api_host"
          append_env STAGING_API_URL "$STAGING_API_URL_VALUE"
          append_env STAGING_FRONTEND_ORIGIN "$STAGING_FRONTEND_ORIGIN_VALUE"
          append_env MAX_INSTANCES "$MAX_INSTANCES_VALUE"
          append_env SECRET_JWT_NAME "$SECRET_JWT_NAME_VALUE"
          append_env SECRET_SQL_NAME "$SECRET_SQL_NAME_VALUE"
          append_env SECRET_REDIS_NAME "$SECRET_REDIS_NAME_VALUE"
          append_env LEARNHOUSE_ENV staging
          append_env LEARNHOUSE_DEVELOPMENT_MODE false
          append_env LEARNHOUSE_SITE_NAME 'XpeX Academy Staging'
          append_env LEARNHOUSE_SITE_DESCRIPTION 'XpeX Academy staging API'
          append_env LEARNHOUSE_CONTACT_EMAIL staging-ops@example.invalid
          append_env LEARNHOUSE_DOMAIN "$api_host"
          append_env LEARNHOUSE_FRONTEND_DOMAIN "$frontend_host"
          append_env LEARNHOUSE_SSL true
          append_env LEARNHOUSE_PORT 8080
          append_env LEARNHOUSE_TENANCY single
          append_env LEARNHOUSE_ALLOWED_ORIGINS "$STAGING_FRONTEND_ORIGIN_VALUE"
          append_env LEARNHOUSE_CONTENT_DELIVERY_TYPE s3api
          append_env LEARNHOUSE_S3_API_BUCKET_NAME "$STAGING_BUCKET_VALUE"
          append_env LEARNHOUSE_S3_API_ENDPOINT_URL https://storage.googleapis.com
          append_env LEARNHOUSE_AUTH_JWT_SECRET_KEY "secret-manager-name:$SECRET_JWT_NAME_VALUE"
          append_env LEARNHOUSE_SQL_CONNECTION_STRING "secret-manager-name:$SECRET_SQL_NAME_VALUE"
          append_env LEARNHOUSE_REDIS_CONNECTION_STRING "secret-manager-name:$SECRET_REDIS_NAME_VALUE"
          append_env LEARNHOUSE_IS_AI_ENABLED false
          echo "ENV_FILE=$ENV_FILE" >> "$GITHUB_ENV"
          trap - EXIT
      - name: Re-run real audit and preflight before mutation
        env:
          FULL_SHA: ${{ needs.plan.outputs.full_sha }}
          IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
          GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$FULL_SHA" ]] || { echo "NO-GO: HEAD changed before build" >&2; exit 20; }
          git fetch --no-tags origin dev:refs/remotes/origin/dev
          git merge-base --is-ancestor "$FULL_SHA" refs/remotes/origin/dev
          [[ "$IMAGE_TAG" == "stg-${FULL_SHA:0:12}" ]] || { echo "NO-GO: image_tag changed before build" >&2; exit 20; }
          scripts/audit-staging-resources.sh --env-file "$ENV_FILE"
          scripts/preflight-staging.sh --env-file "$ENV_FILE"
          test "$(gcloud config get-value project)" = "$GCP_PROJECT_ID_VALUE"
      - name: Build, deploy, verify, and collect evidence
        env:
          FULL_SHA: ${{ needs.plan.outputs.full_sha }}
          IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
          PREVIOUS_REVISION: ${{ inputs.previous_revision }}
          CHANGE_TICKET: ${{ inputs.change_ticket }}
          GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION_VALUE: ${{ vars.GCP_REGION }}
          ARTIFACT_REPOSITORY_VALUE: ${{ vars.ARTIFACT_REPOSITORY }}
          CLOUD_RUN_SERVICE_VALUE: ${{ vars.CLOUD_RUN_SERVICE }}
          STAGING_API_URL_VALUE: ${{ vars.STAGING_API_URL }}
          STAGING_FRONTEND_ORIGIN_VALUE: ${{ vars.STAGING_FRONTEND_ORIGIN }}
        run: |
          set -euo pipefail
          scripts/build-staging.sh --env-file "$ENV_FILE" --image-tag "$IMAGE_TAG" --execute
          IMAGE_URI="$GCP_REGION_VALUE-docker.pkg.dev/$GCP_PROJECT_ID_VALUE/$ARTIFACT_REPOSITORY_VALUE/xpex-academy-api:$IMAGE_TAG"
          IMAGE_DIGEST="$(gcloud artifacts docker images describe "$IMAGE_URI" --format='value(image_summary.digest)')"
          DRY_RUN=false IMAGE_TAG="$IMAGE_TAG" scripts/deploy-staging.sh --env-file "$ENV_FILE"
          NEW_REVISION="$(gcloud run services describe "$CLOUD_RUN_SERVICE_VALUE" --project "$GCP_PROJECT_ID_VALUE" --region "$GCP_REGION_VALUE" --format='value(status.latestReadyRevisionName)')"
          set +e
          scripts/verify-staging-deployment.sh "$STAGING_API_URL_VALUE" "$STAGING_FRONTEND_ORIGIN_VALUE"
          verify_rc=$?
          set -e
          rollback="scripts/prepare-staging-rollback.sh --env-file \"$ENV_FILE\" --previous-revision \"$PREVIOUS_REVISION\""
          OUT_DIR="$RUNNER_TEMP/staging-evidence" COMMIT_SHA="$FULL_SHA" IMAGE_URI="$IMAGE_URI" IMAGE_DIGEST="$IMAGE_DIGEST" PROJECT_ID="$GCP_PROJECT_ID_VALUE" REGION="$GCP_REGION_VALUE" SERVICE_NAME="$CLOUD_RUN_SERVICE_VALUE" NEW_REVISION="$NEW_REVISION" SERVICE_URL="$STAGING_API_URL_VALUE" VERIFY_RESULT="$([[ $verify_rc -eq 0 ]] && echo aprovado || echo reprovado)" FINAL_CLASSIFICATION="$([[ $verify_rc -eq 0 ]] && echo GO || echo NO-GO)" ROLLBACK_COMMAND="$rollback" scripts/collect-staging-deploy-evidence.sh
          if [[ "$verify_rc" -eq 0 ]]; then
            {
              echo "PLANO: GO"
              echo "EXECUÇÃO: concluída"
              echo "BUILD: concluído"
              echo "DEPLOY: concluído"
              echo "VERIFY: aprovado"
              echo "ROLLBACK: não necessário"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "PLANO: GO"
              echo "EXECUÇÃO: falhou"
              echo "BUILD: concluído"
              echo "DEPLOY: concluído"
              echo "VERIFY: reprovado"
              echo "ROLLBACK: preparado para execução humana"
            } >> "$GITHUB_STEP_SUMMARY"
            PREVIOUS_REVISION="$PREVIOUS_REVISION" scripts/prepare-staging-rollback.sh --env-file "$ENV_FILE" --previous-revision "$PREVIOUS_REVISION"
            exit "$verify_rc"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-deploy-evidence-redacted
          path: ${{ runner.temp }}/staging-evidence
          retention-days: 14
      - name: Remove temporary staging env
        if: always()
        run: rm -f "$ENV_FILE"
