name: Manual staging deploy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA that exists on dev
        required: true
        type: string
      mode:
        description: Render plan only or execute after approval
        required: true
        default: plan
        type: choice
        options: [plan, execute]
      confirmation:
        description: Required for execute; exact value DEPLOY_XPEX_STAGING
        required: false
        type: string
      previous_revision:
        description: Required concrete Cloud Run revision for execute rollback preparation
        required: false
        type: string
      change_ticket:
        description: Required human approval/evidence identifier for execute
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: xpex-academy-staging-deploy
  cancel-in-progress: false

env:
  EXPECTED_CONFIRMATION: DEPLOY_XPEX_STAGING

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.decision.outputs.decision }}
      image_tag: ${{ steps.context.outputs.image_tag }}
      full_sha: ${{ steps.context.outputs.full_sha }}
      plan_config_sha256: ${{ steps.envfile.outputs.plan_config_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Validate dispatch inputs and derive immutable context
        id: context
        env:
          COMMIT_SHA_INPUT: ${{ inputs.commit_sha }}
          MODE_INPUT: ${{ inputs.mode }}
          CONFIRMATION_INPUT: ${{ inputs.confirmation }}
          PREVIOUS_REVISION_INPUT: ${{ inputs.previous_revision }}
          CHANGE_TICKET_INPUT: ${{ inputs.change_ticket }}
        run: |
          set -euo pipefail
          validation_output="$(scripts/validate-staging-deploy-inputs.sh --require-dev-ancestry)"
          full_sha="$(printf '%s\n' "$validation_output" | awk -F= '$1 == "FULL_SHA" { print $2 }')"
          image_tag="$(printf '%s\n' "$validation_output" | awk -F= '$1 == "IMAGE_TAG" { print $2 }')"
          [[ -n "$full_sha" && -n "$image_tag" ]] || { echo "NO-GO: validator did not return immutable context" >&2; exit 20; }
          echo "full_sha=$full_sha" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
      - name: Preserve immutable control helpers and checkout approved full_sha
        env:
          FULL_SHA: ${{ steps.context.outputs.full_sha }}
          IMAGE_TAG: ${{ steps.context.outputs.image_tag }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$CONTROL_PLANE_SHA" ]] || { echo "NO-GO: control plane checkout is not github.sha" >&2; exit 20; }
          CONTROL_HELPERS_DIR="$RUNNER_TEMP/staging-control-helpers"
          install -d -m 700 "$CONTROL_HELPERS_DIR"
          install -m 700 scripts/staging-env-file.sh "$CONTROL_HELPERS_DIR/staging-env-file.sh"
          install -m 700 scripts/classify-staging-plan.sh "$CONTROL_HELPERS_DIR/classify-staging-plan.sh"
          env_helper_sha="$(sha256sum "$CONTROL_HELPERS_DIR/staging-env-file.sh" | awk '{print $1}')"
          classifier_sha="$(sha256sum "$CONTROL_HELPERS_DIR/classify-staging-plan.sh" | awk '{print $1}')"
          echo "CONTROL_HELPERS_DIR=$CONTROL_HELPERS_DIR" >> "$GITHUB_ENV"
          echo "CONTROL_ENV_HELPER_SHA=$env_helper_sha" >> "$GITHUB_ENV"
          echo "CONTROL_CLASSIFIER_SHA=$classifier_sha" >> "$GITHUB_ENV"
          echo "Control helper hashes recorded for immutable revision $CONTROL_PLANE_SHA"
          git checkout --detach "$FULL_SHA"
          [[ "$(sha256sum "$CONTROL_HELPERS_DIR/staging-env-file.sh" | awk '{print $1}')" == "$env_helper_sha" ]]
          [[ "$(sha256sum "$CONTROL_HELPERS_DIR/classify-staging-plan.sh" | awk '{print $1}')" == "$classifier_sha" ]]
          [[ "$(git rev-parse HEAD)" == "$FULL_SHA" ]] || { echo "NO-GO: plan HEAD differs from approved full_sha" >&2; exit 20; }
          git fetch --no-tags origin dev:refs/remotes/origin/dev
          git merge-base --is-ancestor "$FULL_SHA" refs/remotes/origin/dev
          [[ "$IMAGE_TAG" == "stg-${FULL_SHA:0:12}" ]] || { echo "NO-GO: image_tag differs from approved full_sha" >&2; exit 20; }
      - name: Initialize redacted plan diagnostics
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/staging-plan"
          printf 'NO-GO: renderer did not complete; inspect preceding workflow steps.\n' > "$RUNNER_TEMP/staging-plan/plan.md"
          printf 'NO-GO: audit did not complete; inspect preceding workflow steps.\n' > "$RUNNER_TEMP/staging-plan/audit.md"
          printf 'NO-GO: preflight did not complete; inspect preceding workflow steps.\n' > "$RUNNER_TEMP/staging-plan/preflight.md"
          printf 'plan_config_sha256=unavailable\n' > "$RUNNER_TEMP/staging-plan/config-fingerprint.txt"
      - name: Prepare temporary staging env and config fingerprint
        id: envfile
        env:
          GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION_VALUE: ${{ vars.GCP_REGION }}
          ARTIFACT_REPOSITORY_VALUE: ${{ vars.ARTIFACT_REPOSITORY }}
          CLOUD_RUN_SERVICE_VALUE: ${{ vars.CLOUD_RUN_SERVICE }}
          CLOUD_RUN_SA_VALUE: ${{ vars.CLOUD_RUN_SA }}
          CLOUD_SQL_INSTANCE_VALUE: ${{ vars.CLOUD_SQL_INSTANCE }}
          DB_NAME_VALUE: ${{ vars.DB_NAME }}
          DB_USER_VALUE: ${{ vars.DB_USER }}
          REDIS_INSTANCE_VALUE: ${{ vars.REDIS_INSTANCE }}
          VPC_CONNECTOR_VALUE: ${{ vars.VPC_CONNECTOR }}
          STAGING_BUCKET_VALUE: ${{ vars.STAGING_BUCKET }}
          STAGING_API_URL_VALUE: ${{ vars.STAGING_API_URL }}
          STAGING_FRONTEND_ORIGIN_VALUE: ${{ vars.STAGING_FRONTEND_ORIGIN }}
          MAX_INSTANCES_VALUE: ${{ vars.MAX_INSTANCES }}
          SECRET_JWT_NAME_VALUE: ${{ vars.SECRET_JWT_NAME }}
          SECRET_SQL_NAME_VALUE: ${{ vars.SECRET_SQL_NAME }}
          SECRET_REDIS_NAME_VALUE: ${{ vars.SECRET_REDIS_NAME }}
          IMAGE_TAG_VALUE: ${{ steps.context.outputs.image_tag }}
        run: |
          set -euo pipefail
          ENV_FILE="$RUNNER_TEMP/staging.env"
          CONFIG_FILE="$RUNNER_TEMP/staging-plan-config.txt"
          # shellcheck source=scripts/staging-env-file.sh
          source "$CONTROL_HELPERS_DIR/staging-env-file.sh"
          reject_unsafe_value() { reject_unsafe_env_value "$@"; }
          append_env() { append_bash_env "$ENV_FILE" "$1" "$2"; }
          append_config() { local name="$1" value="$2"; reject_unsafe_value "$name" "$value"; printf '%s=%s\n' "$name" "$value" >> "$CONFIG_FILE"; }
          : > "$ENV_FILE"; : > "$CONFIG_FILE"; chmod 600 "$ENV_FILE" "$CONFIG_FILE"
          api_host="$STAGING_API_URL_VALUE"; api_host="${api_host#http://}"; api_host="${api_host#https://}"; api_host="${api_host%%/*}"
          frontend_host="$STAGING_FRONTEND_ORIGIN_VALUE"; frontend_host="${frontend_host#http://}"; frontend_host="${frontend_host#https://}"; frontend_host="${frontend_host%%/*}"
          for item in GCP_PROJECT_ID_VALUE GCP_REGION_VALUE ARTIFACT_REPOSITORY_VALUE CLOUD_RUN_SERVICE_VALUE CLOUD_RUN_SA_VALUE CLOUD_SQL_INSTANCE_VALUE DB_NAME_VALUE DB_USER_VALUE REDIS_INSTANCE_VALUE VPC_CONNECTOR_VALUE STAGING_BUCKET_VALUE STAGING_API_URL_VALUE STAGING_FRONTEND_ORIGIN_VALUE MAX_INSTANCES_VALUE SECRET_JWT_NAME_VALUE SECRET_SQL_NAME_VALUE SECRET_REDIS_NAME_VALUE; do : "${!item:?missing $item}"; done
          append_env GCP_PROJECT_ID "$GCP_PROJECT_ID_VALUE"; append_config GCP_PROJECT_ID "$GCP_PROJECT_ID_VALUE"
          append_env GCP_REGION "$GCP_REGION_VALUE"; append_config GCP_REGION "$GCP_REGION_VALUE"
          append_env ARTIFACT_REPOSITORY "$ARTIFACT_REPOSITORY_VALUE"; append_config ARTIFACT_REPOSITORY "$ARTIFACT_REPOSITORY_VALUE"
          append_env CLOUD_RUN_SERVICE "$CLOUD_RUN_SERVICE_VALUE"; append_config CLOUD_RUN_SERVICE "$CLOUD_RUN_SERVICE_VALUE"
          append_env SERVICE_NAME "$CLOUD_RUN_SERVICE_VALUE"
          append_env IMAGE_NAME xpex-academy-api
          append_env CLOUD_RUN_SA "$CLOUD_RUN_SA_VALUE"; append_config CLOUD_RUN_SA "$CLOUD_RUN_SA_VALUE"
          append_env CLOUD_RUN_SERVICE_ACCOUNT "$CLOUD_RUN_SA_VALUE"
          append_env CLOUD_SQL_INSTANCE "$CLOUD_SQL_INSTANCE_VALUE"; append_config CLOUD_SQL_INSTANCE "$CLOUD_SQL_INSTANCE_VALUE"
          append_env DB_NAME "$DB_NAME_VALUE"; append_config DB_NAME "$DB_NAME_VALUE"
          append_env DB_USER "$DB_USER_VALUE"; append_config DB_USER "$DB_USER_VALUE"
          append_env REDIS_INSTANCE "$REDIS_INSTANCE_VALUE"; append_config REDIS_INSTANCE "$REDIS_INSTANCE_VALUE"
          append_env VPC_CONNECTOR "$VPC_CONNECTOR_VALUE"; append_config VPC_CONNECTOR "$VPC_CONNECTOR_VALUE"
          append_env STAGING_BUCKET "$STAGING_BUCKET_VALUE"; append_config STAGING_BUCKET "$STAGING_BUCKET_VALUE"
          append_env STAGING_API_HOST "$api_host"
          append_env STAGING_API_URL "$STAGING_API_URL_VALUE"; append_config STAGING_API_URL "$STAGING_API_URL_VALUE"
          append_env STAGING_FRONTEND_ORIGIN "$STAGING_FRONTEND_ORIGIN_VALUE"; append_config STAGING_FRONTEND_ORIGIN "$STAGING_FRONTEND_ORIGIN_VALUE"
          append_env IMAGE_TAG "$IMAGE_TAG_VALUE"
          append_env MAX_INSTANCES "$MAX_INSTANCES_VALUE"; append_config MAX_INSTANCES "$MAX_INSTANCES_VALUE"
          append_env SECRET_JWT_NAME "$SECRET_JWT_NAME_VALUE"; append_config SECRET_JWT_NAME "$SECRET_JWT_NAME_VALUE"
          append_env SECRET_SQL_NAME "$SECRET_SQL_NAME_VALUE"; append_config SECRET_SQL_NAME "$SECRET_SQL_NAME_VALUE"
          append_env SECRET_REDIS_NAME "$SECRET_REDIS_NAME_VALUE"; append_config SECRET_REDIS_NAME "$SECRET_REDIS_NAME_VALUE"
          append_env LEARNHOUSE_ENV staging; append_env LEARNHOUSE_DEVELOPMENT_MODE false; append_env LEARNHOUSE_SITE_NAME 'XpeX Academy Staging'; append_env LEARNHOUSE_SITE_DESCRIPTION 'XpeX Academy staging API'; append_env LEARNHOUSE_CONTACT_EMAIL staging-ops@example.invalid; append_env LEARNHOUSE_DOMAIN "$api_host"; append_env LEARNHOUSE_FRONTEND_DOMAIN "$frontend_host"; append_env LEARNHOUSE_SSL true; append_env LEARNHOUSE_PORT 8080; append_env LEARNHOUSE_TENANCY single; append_env LEARNHOUSE_ALLOWED_ORIGINS "$STAGING_FRONTEND_ORIGIN_VALUE"; append_env LEARNHOUSE_CONTENT_DELIVERY_TYPE s3api; append_env LEARNHOUSE_S3_API_BUCKET_NAME "$STAGING_BUCKET_VALUE"; append_env LEARNHOUSE_S3_API_ENDPOINT_URL https://storage.googleapis.com; append_env LEARNHOUSE_AUTH_JWT_SECRET_KEY "secret-manager-name:$SECRET_JWT_NAME_VALUE"; append_env LEARNHOUSE_SQL_CONNECTION_STRING "secret-manager-name:$SECRET_SQL_NAME_VALUE"; append_env LEARNHOUSE_REDIS_CONNECTION_STRING "secret-manager-name:$SECRET_REDIS_NAME_VALUE"; append_env LEARNHOUSE_IS_AI_ENABLED false
          validate_bash_env_round_trip "$ENV_FILE" \
            LEARNHOUSE_SITE_NAME 'XpeX Academy Staging' \
            LEARNHOUSE_SITE_DESCRIPTION 'XpeX Academy staging API' \
            STAGING_API_URL "$STAGING_API_URL_VALUE" \
            STAGING_FRONTEND_ORIGIN "$STAGING_FRONTEND_ORIGIN_VALUE" \
            LEARNHOUSE_ALLOWED_ORIGINS "$STAGING_FRONTEND_ORIGIN_VALUE" \
            LEARNHOUSE_AUTH_JWT_SECRET_KEY "secret-manager-name:$SECRET_JWT_NAME_VALUE" \
            LEARNHOUSE_SQL_CONNECTION_STRING "secret-manager-name:$SECRET_SQL_NAME_VALUE" \
            LEARNHOUSE_REDIS_CONNECTION_STRING "secret-manager-name:$SECRET_REDIS_NAME_VALUE"
          plan_config_sha256="$(sort "$CONFIG_FILE" | sha256sum | awk '{print $1}')"
          echo "ENV_FILE=$ENV_FILE" >> "$GITHUB_ENV"
          echo "PLAN_CONFIG_SHA256=$plan_config_sha256" >> "$GITHUB_ENV"
          echo "plan_config_sha256=$plan_config_sha256" >> "$GITHUB_OUTPUT"
      - name: Render plan and run read-only checks
        id: decision
        env:
          PREVIOUS_REVISION: ${{ inputs.previous_revision }}
          MODE_INPUT: ${{ inputs.mode }}
          FULL_SHA: ${{ steps.context.outputs.full_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$FULL_SHA" ]] || { echo "NO-GO: renderer would run on non-approved HEAD" >&2; exit 20; }
          mkdir -p "$RUNNER_TEMP/staging-plan"
          printf 'plan_config_sha256=%s\n' "$PLAN_CONFIG_SHA256" > "$RUNNER_TEMP/staging-plan/config-fingerprint.txt"
          set +e
          required=(scripts/render-first-staging-deploy-plan.sh scripts/audit-staging-resources.sh scripts/preflight-staging.sh scripts/validate-staging-deploy-inputs.sh)
          if [[ "$MODE_INPUT" == execute ]]; then required+=(scripts/build-staging.sh scripts/deploy-staging.sh scripts/verify-staging-deployment.sh scripts/prepare-staging-rollback.sh); fi
          missing=""
          for path in "${required[@]}"; do [[ -f "$path" ]] || { missing="$path"; break; }; done
          if [[ -n "$missing" ]]; then
            printf 'NO-GO: approved commit is missing required operational script: %s\n' "$missing" | tee "$RUNNER_TEMP/staging-plan/plan.md" "$RUNNER_TEMP/staging-plan/audit.md" "$RUNNER_TEMP/staging-plan/preflight.md" >/dev/null
            renderer_rc=20; audit_rc=20; preflight_rc=20
          else
            scripts/render-first-staging-deploy-plan.sh --env-file "$ENV_FILE" > "$RUNNER_TEMP/staging-plan/plan.md" 2>&1; renderer_rc=$?
            scripts/audit-staging-resources.sh --env-file "$ENV_FILE" > "$RUNNER_TEMP/staging-plan/audit.md" 2>&1; audit_rc=$?
            scripts/preflight-staging.sh --env-file "$ENV_FILE" > "$RUNNER_TEMP/staging-plan/preflight.md" 2>&1; preflight_rc=$?
          fi
          set -e
          set +e
          decision="$("$CONTROL_HELPERS_DIR/classify-staging-plan.sh" "$renderer_rc" "$audit_rc" "$preflight_rc")"
          final_rc=$?
          set -e
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "final_rc=$final_rc" >> "$GITHUB_OUTPUT"
          execution="não solicitada"; if [[ "$MODE_INPUT" == "execute" ]]; then if [[ "$decision" == "GO" ]]; then execution="aprovada"; else execution="bloqueada"; fi; fi
          { echo "PLANO: $decision"; echo "EXECUÇÃO: $execution"; echo "BUILD: não executado"; echo "DEPLOY: não executado"; echo "VERIFY: não executado"; echo "ROLLBACK: não necessário"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-deploy-plan-redacted
          path: ${{ runner.temp }}/staging-plan
          retention-days: 14
      - name: Remove temporary staging env
        if: always()
        run: rm -f "${ENV_FILE:-}" "$RUNNER_TEMP/staging-plan-config.txt"
      - name: Enforce staging plan decision
        if: always()
        env:
          FINAL_RC: ${{ steps.decision.outputs.final_rc }}
        run: |
          set -euo pipefail
          case "${FINAL_RC:-20}" in
            0) exit 0 ;;
            10) exit 10 ;;
            *) exit 20 ;;
          esac

  deploy:
    name: deploy
    needs: plan
    if: ${{ inputs.mode == 'execute' && needs.plan.outputs.decision == 'GO' }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      BUILD_RESULT: não executado
      DEPLOY_RESULT: não executado
      VERIFY_RESULT: não executado
      FINAL_CLASSIFICATION: NO-GO
      ROLLBACK_RESULT: não necessário
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: preserve-control-helpers-and-checkout-approved-sha
        env:
          FULL_SHA: ${{ needs.plan.outputs.full_sha }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$CONTROL_PLANE_SHA" ]] || { echo "NO-GO: control plane checkout is not github.sha" >&2; exit 20; }
          CONTROL_HELPERS_DIR="$RUNNER_TEMP/staging-control-helpers"
          install -d -m 700 "$CONTROL_HELPERS_DIR"
          install -m 700 scripts/staging-env-file.sh "$CONTROL_HELPERS_DIR/staging-env-file.sh"
          install -m 700 scripts/classify-staging-plan.sh "$CONTROL_HELPERS_DIR/classify-staging-plan.sh"
          env_helper_sha="$(sha256sum "$CONTROL_HELPERS_DIR/staging-env-file.sh" | awk '{print $1}')"
          classifier_sha="$(sha256sum "$CONTROL_HELPERS_DIR/classify-staging-plan.sh" | awk '{print $1}')"
          git checkout --detach "$FULL_SHA"
          [[ "$(sha256sum "$CONTROL_HELPERS_DIR/staging-env-file.sh" | awk '{print $1}')" == "$env_helper_sha" ]]
          [[ "$(sha256sum "$CONTROL_HELPERS_DIR/classify-staging-plan.sh" | awk '{print $1}')" == "$classifier_sha" ]]
          for path in scripts/validate-staging-deploy-inputs.sh scripts/build-staging.sh scripts/deploy-staging.sh scripts/verify-staging-deployment.sh scripts/prepare-staging-rollback.sh; do
            [[ -f "$path" ]] || { printf 'NO-GO: approved commit is missing required operational script: %s\n' "$path" >&2; exit 20; }
          done
          echo "CONTROL_HELPERS_DIR=$CONTROL_HELPERS_DIR" >> "$GITHUB_ENV"
          echo "CONTROL_ENV_HELPER_SHA=$env_helper_sha" >> "$GITHUB_ENV"
          echo "CONTROL_CLASSIFIER_SHA=$classifier_sha" >> "$GITHUB_ENV"
      - name: validate-runtime-context
        id: validate_runtime_context
        env:
          FULL_SHA: ${{ needs.plan.outputs.full_sha }}
          IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
          PLAN_CONFIG_SHA256: ${{ needs.plan.outputs.plan_config_sha256 }}
          MODE_INPUT: ${{ inputs.mode }}
          CONFIRMATION_INPUT: ${{ inputs.confirmation }}
          PREVIOUS_REVISION_INPUT: ${{ inputs.previous_revision }}
          CHANGE_TICKET_INPUT: ${{ inputs.change_ticket }}
          GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION_VALUE: ${{ vars.GCP_REGION }}
          ARTIFACT_REPOSITORY_VALUE: ${{ vars.ARTIFACT_REPOSITORY }}
          CLOUD_RUN_SERVICE_VALUE: ${{ vars.CLOUD_RUN_SERVICE }}
          CLOUD_RUN_SA_VALUE: ${{ vars.CLOUD_RUN_SA }}
          CLOUD_SQL_INSTANCE_VALUE: ${{ vars.CLOUD_SQL_INSTANCE }}
          DB_NAME_VALUE: ${{ vars.DB_NAME }}
          DB_USER_VALUE: ${{ vars.DB_USER }}
          REDIS_INSTANCE_VALUE: ${{ vars.REDIS_INSTANCE }}
          VPC_CONNECTOR_VALUE: ${{ vars.VPC_CONNECTOR }}
          STAGING_BUCKET_VALUE: ${{ vars.STAGING_BUCKET }}
          STAGING_API_URL_VALUE: ${{ vars.STAGING_API_URL }}
          STAGING_FRONTEND_ORIGIN_VALUE: ${{ vars.STAGING_FRONTEND_ORIGIN }}
          MAX_INSTANCES_VALUE: ${{ vars.MAX_INSTANCES }}
          SECRET_JWT_NAME_VALUE: ${{ vars.SECRET_JWT_NAME }}
          SECRET_SQL_NAME_VALUE: ${{ vars.SECRET_SQL_NAME }}
          SECRET_REDIS_NAME_VALUE: ${{ vars.SECRET_REDIS_NAME }}
        run: |
          set -euo pipefail
          COMMIT_SHA_INPUT="$FULL_SHA" scripts/validate-staging-deploy-inputs.sh
          [[ "$(git rev-parse HEAD)" == "$FULL_SHA" ]] || { echo "NO-GO: checkout HEAD differs from approved full_sha" >&2; exit 20; }
          git fetch --no-tags origin dev:refs/remotes/origin/dev
          git merge-base --is-ancestor "$FULL_SHA" refs/remotes/origin/dev
          [[ "$IMAGE_TAG" == "stg-${FULL_SHA:0:12}" ]] || { echo "NO-GO: image_tag differs from approved full_sha" >&2; exit 20; }
          config_sha="$(printf '%s=%s\n' ARTIFACT_REPOSITORY "$ARTIFACT_REPOSITORY_VALUE" CLOUD_RUN_SA "$CLOUD_RUN_SA_VALUE" CLOUD_RUN_SERVICE "$CLOUD_RUN_SERVICE_VALUE" CLOUD_SQL_INSTANCE "$CLOUD_SQL_INSTANCE_VALUE" DB_NAME "$DB_NAME_VALUE" DB_USER "$DB_USER_VALUE" GCP_PROJECT_ID "$GCP_PROJECT_ID_VALUE" GCP_REGION "$GCP_REGION_VALUE" MAX_INSTANCES "$MAX_INSTANCES_VALUE" REDIS_INSTANCE "$REDIS_INSTANCE_VALUE" SECRET_JWT_NAME "$SECRET_JWT_NAME_VALUE" SECRET_REDIS_NAME "$SECRET_REDIS_NAME_VALUE" SECRET_SQL_NAME "$SECRET_SQL_NAME_VALUE" STAGING_API_URL "$STAGING_API_URL_VALUE" STAGING_BUCKET "$STAGING_BUCKET_VALUE" STAGING_FRONTEND_ORIGIN "$STAGING_FRONTEND_ORIGIN_VALUE" VPC_CONNECTOR "$VPC_CONNECTOR_VALUE" | sort | sha256sum | awk '{print $1}')"
          [[ "$config_sha" == "$PLAN_CONFIG_SHA256" ]] || { echo "NO-GO: protected staging config fingerprint differs from plan" >&2; exit 20; }
          echo "plan_config_sha256=$PLAN_CONFIG_SHA256" >> "$GITHUB_OUTPUT"
          echo "previous_revision=$PREVIOUS_REVISION_INPUT" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: prepare-env
        id: prepare_env
        env:
          IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
          GCP_PROJECT_ID_VALUE: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION_VALUE: ${{ vars.GCP_REGION }}
          ARTIFACT_REPOSITORY_VALUE: ${{ vars.ARTIFACT_REPOSITORY }}
          CLOUD_RUN_SERVICE_VALUE: ${{ vars.CLOUD_RUN_SERVICE }}
          CLOUD_RUN_SA_VALUE: ${{ vars.CLOUD_RUN_SA }}
          CLOUD_SQL_INSTANCE_VALUE: ${{ vars.CLOUD_SQL_INSTANCE }}
          DB_NAME_VALUE: ${{ vars.DB_NAME }}
          DB_USER_VALUE: ${{ vars.DB_USER }}
          REDIS_INSTANCE_VALUE: ${{ vars.REDIS_INSTANCE }}
          VPC_CONNECTOR_VALUE: ${{ vars.VPC_CONNECTOR }}
          STAGING_BUCKET_VALUE: ${{ vars.STAGING_BUCKET }}
          STAGING_API_URL_VALUE: ${{ vars.STAGING_API_URL }}
          STAGING_FRONTEND_ORIGIN_VALUE: ${{ vars.STAGING_FRONTEND_ORIGIN }}
          MAX_INSTANCES_VALUE: ${{ vars.MAX_INSTANCES }}
          SECRET_JWT_NAME_VALUE: ${{ vars.SECRET_JWT_NAME }}
          SECRET_SQL_NAME_VALUE: ${{ vars.SECRET_SQL_NAME }}
          SECRET_REDIS_NAME_VALUE: ${{ vars.SECRET_REDIS_NAME }}
        run: |
          set -euo pipefail
          ENV_FILE="$RUNNER_TEMP/staging.env"; : > "$ENV_FILE"; chmod 600 "$ENV_FILE"
          api_host="$STAGING_API_URL_VALUE"; api_host="${api_host#http://}"; api_host="${api_host#https://}"; api_host="${api_host%%/*}"
          frontend_host="$STAGING_FRONTEND_ORIGIN_VALUE"; frontend_host="${frontend_host#http://}"; frontend_host="${frontend_host#https://}"; frontend_host="${frontend_host%%/*}"
          # shellcheck source=scripts/staging-env-file.sh
          source "$CONTROL_HELPERS_DIR/staging-env-file.sh"
          append_env(){ append_bash_env "$ENV_FILE" "$1" "$2"; }
