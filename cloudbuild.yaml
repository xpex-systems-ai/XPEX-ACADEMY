# Build-only staging pipeline. It builds and pushes the Cloud Run image but does not deploy.
substitutions:
  _REGION: us-central1
  _ARTIFACT_REPOSITORY: xpex-academy-staging
  _IMAGE_NAME: xpex-academy-api
  _SERVICE_NAME: xpex-academy-staging
  _BUILD_CONTEXT: apps/api
  _DOCKERFILE: apps/api/Dockerfile

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s

steps:
  - name: gcr.io/cloud-builders/docker
    id: build-staging-image
    args:
      - build
      - --file
      - ${_DOCKERFILE}
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:staging-latest
      - ${_BUILD_CONTEXT}

  - name: gcr.io/cloud-builders/docker
    id: validate-staging-image
    args:
      - run
      - --rm
      - --entrypoint
      - /bin/bash
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA
      - -lc
      - LEARNHOUSE_AUTH_JWT_SECRET_KEY=staging-import-check-secret-minimum-32 TESTING=true uv run python -c "import app, numpy; print('imports ok')"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:staging-latest
